<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">\n<rect width="100%" height="100%" fill="white"/>\n<text x="275" y="30" text-anchor="middle" font-size="18">Residual norm (descriptive only)</text>\n<text x="825" y="30" text-anchor="middle" font-size="18">Held-out valid-pair Euclidean AUC</text>\n<line x1="70" y1="400" x2="500" y2="400" stroke="#dddddd"/>\n<line x1="70" y1="300" x2="500" y2="300" stroke="#dddddd"/>\n<line x1="70" y1="200" x2="500" y2="200" stroke="#dddddd"/>\n<line x1="70" y1="100" x2="500" y2="100" stroke="#dddddd"/>\n<line x1="620" y1="400" x2="1050" y2="400" stroke="#dddddd"/>\n<line x1="620" y1="300" x2="1050" y2="300" stroke="#dddddd"/>\n<line x1="620" y1="200" x2="1050" y2="200" stroke="#dddddd"/>\n<line x1="620" y1="100" x2="1050" y2="100" stroke="#dddddd"/>\n<polyline points="90,69.99999999999994 280,286.61168644519034 470,317.52846864884236" fill="none" stroke="#1769aa" stroke-width="3"/>\n<circle cx="90" cy="69.99999999999994" r="5" fill="#1769aa"/>\n<circle cx="280" cy="286.61168644519034" r="5" fill="#1769aa"/>\n<circle cx="470" cy="317.52846864884236" r="5" fill="#1769aa"/>\n<polyline points="640,143.6919875130073 830,227.78002081165454 1020,233.13194588969824" fill="none" stroke="#1769aa" stroke-width="3"/>\n<circle cx="640" cy="143.6919875130073" r="5" fill="#1769aa"/>\n<circle cx="830" cy="227.78002081165454" r="5" fill="#1769aa"/>\n<circle cx="1020" cy="233.13194588969824" r="5" fill="#1769aa"/>\n<polyline points="90,250.03917556937208 280,336.1471317045291 470,345.0495442371058" fill="none" stroke="#c44735" stroke-width="3"/>\n<circle cx="90" cy="250.03917556937208" r="5" fill="#c44735"/>\n<circle cx="280" cy="336.1471317045291" r="5" fill="#c44735"/>\n<circle cx="470" cy="345.0495442371058" r="5" fill="#c44735"/>\n<polyline points="640,185.36295525494276 830,221.1868886576483 1020,222.6191467221644" fill="none" stroke="#c44735" stroke-width="3"/>\n<circle cx="640" cy="185.36295525494276" r="5" fill="#c44735"/>\n<circle cx="830" cy="221.1868886576483" r="5" fill="#c44735"/>\n<circle cx="1020" cy="222.6191467221644" r="5" fill="#c44735"/>\n<text x="90" y="430" text-anchor="middle">L1</text>\n<text x="640" y="430" text-anchor="middle">L1</text>\n<text x="280" y="430" text-anchor="middle">L2</text>\n<text x="830" y="430" text-anchor="middle">L2</text>\n<text x="470" y="430" text-anchor="middle">L3</text>\n<text x="1020" y="430" text-anchor="middle">L3</text>\n<text x="550" y="465" text-anchor="middle" font-size="12">Smaller residual norm is NOT by itself evidence of crowding</text>\n</svg>\n
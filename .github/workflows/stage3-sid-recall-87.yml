name: Historical 87 Stage3 SID Recall Correlation
on:
  push:
    branches:
      - codex/stage3-87-sid-recall-analysis
    paths:
      - .github/scripts/audit_stage3_87_sid_recall.py
      - .github/workflows/stage3-sid-recall-87.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sid-recall-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUDIT_REF: 84b4486a8a21c0c1b64de5d9bc0ab0c14254bd74
      EXPECTED_RUNS: "87"
      OUTPUT_DIR: artifacts/stage3-87-sid-recall
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: codex/stage3-87-sid-recall-analysis
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check "scipy>=1.11,<2"
      - name: Recover historical SID and Recall pairs
        run: python .github/scripts/audit_stage3_87_sid_recall.py
      - name: Add report to the job summary
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/report.md" ]; then
            cat "$OUTPUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload pair table, SID blobs, and correlation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-87-sid-recall-analysis
          path: artifacts/stage3-87-sid-recall/
          if-no-files-found: warn
          retention-days: 90

name: Stage3 Admission Regression
on:
  push:
    paths:
      - "tools/genrec-mcp/stage2_quality_gate.py"
      - "tools/genrec-mcp/server.py"
      - "tools/research/tests/test_stage2_quality_gate.py"
      - "tools/research/**"
      - ".github/workflows/stage3-quality-gate-regression.yml"
  pull_request:
    paths:
      - "tools/genrec-mcp/stage2_quality_gate.py"
      - "tools/genrec-mcp/server.py"
      - "tools/research/tests/test_stage2_quality_gate.py"
      - "tools/research/**"
      - ".github/workflows/stage3-quality-gate-regression.yml"

jobs:
  admission:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Stage3 admission without GPU
        run: |
          python -m py_compile tools/genrec-mcp/stage2_quality_gate.py tools/genrec-mcp/server.py
          python -m unittest discover -s tools/research/tests -p "test_stage2_quality_gate.py" -v
      - name: Assert no quality floor survives in the admission path
        run: |
          python - <<'PY'
          from pathlib import Path
          gate = Path("tools/genrec-mcp/stage2_quality_gate.py").read_text()
          server = Path("tools/genrec-mcp/server.py").read_text()
          for banned in ("MIN_VALID_L1_HARD_ER", "MIN_L2_PREFIXES",
                         "valid_l1_hard_er_strict_gt", "level2_prefixes_strict_gt"):
              assert banned not in gate, banned
              assert banned not in server, banned
          assert "stage2_validity_admission" in server
          print("Stage3 admission checks technical validity only")
          PY
      - name: The research package imports on this interpreter
        run: |
          # The MCP server is started by the harness with the system python, and
          # a 3.10-only annotation takes the whole tool surface down at call
          # time. The matrix covers 3.9 and 3.10 for exactly this reason.
          python -m unittest discover -s tools/research/tests -p "test_import_surface.py" -v

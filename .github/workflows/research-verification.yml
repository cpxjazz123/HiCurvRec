name: Native Research Safety Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # The MCP server runs the host's system python3, which is 3.9 in the deployed
  # environment. Importing the research package there catches PEP 604 and other
  # syntax that a 3.10/3.11-only CI would happily accept.
  deployed-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Import the research package under Python 3.9
        run: |
          python - <<'PY'
          import tools.research.workflows.pipeline            # noqa: F401
          import tools.research.verification.admission        # noqa: F401
          import tools.research.verification.workflow         # noqa: F401
          import tools.research.mcp.verification_handlers     # noqa: F401
          import tools.research.science.contract              # noqa: F401
          import tools.research.science.preflight             # noqa: F401
          import tools.research.core.failures                 # noqa: F401
          print("research package imports under", __import__("sys").version.split()[0])
          PY
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Parse changed Python entrypoints without torch
        run: |
          python -m py_compile tools/genrec-mcp/server.py tools/research/verification/admission.py tools/research/verification/workflow.py tools/research/agents/prompts.py tools/research/agents/runner.py tools/research/mcp/handlers.py tools/research/mcp/worker.py tools/research/mcp/verification_handlers.py tools/research/mcp/verify_worker.py
      - name: Install offline science test dependency
        run: python -m pip install numpy==1.26.4
      - name: Existing native research offline regression
        run: python -m unittest discover -s tools/research/tests -v
      - name: Fail-closed verification and fault-injection regression
        run: python -m unittest discover -s tools/research/verification/tests -v
      - name: Issue #120 multi-agent round regressions
        run: python -m unittest discover -s tools/research/tests -p "test_rounds.py" -v
      - name: Replay every known defect against the preflight
        run: |
          python -m tools.research.integrations.defect_report
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/research/issue117/reports/defect_report.json").read_text())
          assert report["all_defects_detected"], [
              row for row in report["defect_classes"] if not row["passed"]]
          print("defect classes:", len(report["defect_classes"]), "| DoD:", report["dod"])
          PY
      - name: Assert no old training-admission bypass
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("tools/genrec-mcp/server.py").read_text()
          assert "def tool_stage2_start(source_dir: str, verification_id: str)" in s
          assert '"verification_check": {' in s
          assert '"cgv_check": {' not in s
          assert "if admission:" not in s
          assert "elif spec:" not in s
          print("Stage2 has a single source-bound independent-test admission path")
          PY
      - name: Assert removed verifier and orphan probe are absent
        run: |
          test ! -e tools/cgv
          test ! -e tools/stage2_stability_probe.py
          python - <<'PY'
          from pathlib import Path
          from tools.research.integrations.preflight import audit_surviving_mainline
          assert "verification" in audit_surviving_mainline()
          assert "cgv" not in audit_surviving_mainline()
          assert Path("tools/research/verification/admission.py").is_file()
          print("Clean research verification structure")
          PY
      - name: Verify MCP research tools are registered
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path("tools/genrec-mcp/server.py").read_text()
          tools = ("research_start", "research_status", "research_results",
                   "research_cancel", "research_resume", "research_verify_start",
                   "research_verify_review", "research_verify_status")
          for name in tools:
              assert f'"{name}": {{' in server, name
          print("All eight native research MCP tools registered")
          PY

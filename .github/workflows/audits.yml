# GitHub Actions workflow for paper submission defense audits (Task #107)
#
# Runs the 4 cumulative paper defense audit scripts on every push and PR:
#   - Task #101: scripts/task101_verify_env.py (repo layout + packages)
#   - Task #103: scripts/task103_paper_claims_audit.py (paper claims Δ=0)
#   - Task #105: scripts/task105_ckpt_integrity.py (R12 best ckpt)
#   - Task #106: scripts/task106_audits.py (5-audit submission defense)
#
# Outputs verdicts/ audit reports as artifacts for PR reviewers.

name: Paper Integrity Audits

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # manual trigger

jobs:
  audits:
    name: Run paper defense audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Don't fetch full history; audits only need the working tree
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimum deps for audits (no torch)
        run: |
          python -m pip install --upgrade pip
          # Audit scripts use only stdlib except task103 which needs pyyaml
          pip install pyyaml

      - name: Task #101 — Environment verification (CI mode)
        run: |
          echo "--- Task #101: Environment verification (CI mode) ---"
          python3 scripts/task101_verify_env.py --skip-data --skip-packages

      - name: Task #103 — Paper claims audit (Δ=0 expected)
        run: |
          echo "--- Task #103: Paper claims audit ---"
          python3 scripts/task103_paper_claims_audit.py

      - name: Task #105 — Best ckpt integrity (CI mode: graceful if absent)
        run: |
          echo "--- Task #105: R12 ckpt integrity (CI mode) ---"
          python3 scripts/task105_ckpt_integrity.py --ci-mode

      - name: Task #106 — Submission defense bundle (5 audits)
        run: |
          echo "--- Task #106: Submission defense bundle ---"
          python3 scripts/task106_audits.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports-${{ github.run_id }}
          path: |
            verdicts/task103_paper_claims_audit.md
            verdicts/task103_paper_claims_audit.csv
            verdicts/task105_ckpt_integrity.md
            verdicts/task106_audits.md
            verdicts/task106_audits.json
          if-no-files-found: warn

      - name: Summarize audit results
        if: always()
        run: |
          echo "### Paper Integrity Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f verdicts/task103_paper_claims_audit.csv ]; then
            n_claims=$(wc -l < verdicts/task103_paper_claims_audit.csv)
            n_pass=$(grep -c ",PASS," verdicts/task103_paper_claims_audit.csv || echo 0)
            echo "- **Task #103 paper claims**: ${n_pass:-0}/${n_claims} PASS" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f verdicts/task106_audits.json ]; then
            n_a1=$(python3 -c "import json; d=json.load(open('verdicts/task106_audits.json')); print('✅' if d['audit_1_md_tex_sync']['verdict_ok'] else '❌')")
            n_a2=$(python3 -c "import json; d=json.load(open('verdicts/task106_audits.json')); print('✅' if d['audit_2_abstract_compliance']['verdict_ok'] else '❌')")
            n_a3=$(python3 -c "import json; d=json.load(open('verdicts/task106_audits.json')); print('✅' if d['audit_3_baseline_coverage']['verdict_ok'] else '❌')")
            n_a4=$(python3 -c "import json; d=json.load(open('verdicts/task106_audits.json')); print('✅' if d['audit_4_number_consistency']['verdict_ok'] else '⚠️')")
            n_a5=$(python3 -c "import json; d=json.load(open('verdicts/task106_audits.json')); print('✅' if d['audit_5_license_attribution']['verdict_ok'] else '❌')")
            echo "- **Task #106 defense bundle**: A1 $n_a1 / A2 $n_a2 / A3 $n_a3 / A4 $n_a4 / A5 $n_a5" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Research ideas 22-27 CPU regression

on:
  push:
    branches: [main, 'fix/tdd-six-ideas-*']
    paths:
      - ".github/workflows/research-ideas-22-27-regression.yml"
      - "scripts/check_research_ideas_22_27.py"
      - "scripts/test_mechanism_contracts_tdd.py"
      - "stage2_RQ-VAE/TIGER_semantic_bounded_residual/**"
      - "stage2_RQ-VAE/TIGER_relational_structure_distill/**"
      - "stage2_RQ-VAE/TIGER_uncertainty_behavioral/**"
      - "stage2_RQ-VAE/TIGER_multi_intent_disentangled/**"
      - "stage2_RQ-VAE/TIGER_invertible_hyperbolic_flow/**"
      - "stage2_RQ-VAE/TIGER_multiscale_behavioral_spectrum/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mechanism source only (omit large training artifacts)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout: |
            scripts
            stage2_RQ-VAE/TIGER_semantic_bounded_residual
            stage2_RQ-VAE/TIGER_relational_structure_distill
            stage2_RQ-VAE/TIGER_uncertainty_behavioral
            stage2_RQ-VAE/TIGER_multi_intent_disentangled
            stage2_RQ-VAE/TIGER_invertible_hyperbolic_flow
            stage2_RQ-VAE/TIGER_multiscale_behavioral_spectrum
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile six mechanism modules
        run: |
          python -m compileall -q \
            scripts/check_research_ideas_22_27.py \
            stage2_RQ-VAE/TIGER_semantic_bounded_residual/semantic_bounded_residual.py \
            stage2_RQ-VAE/TIGER_relational_structure_distill/relational_structure_distill.py \
            stage2_RQ-VAE/TIGER_uncertainty_behavioral/uncertainty_behavioral.py \
            stage2_RQ-VAE/TIGER_multi_intent_disentangled/multi_intent_disentangled.py \
            stage2_RQ-VAE/TIGER_invertible_hyperbolic_flow/invertible_hyperbolic_flow.py \
            stage2_RQ-VAE/TIGER_multiscale_behavioral_spectrum/multiscale_behavioral_spectrum.py
      - name: Run TDD contracts
        run: python scripts/test_mechanism_contracts_tdd.py
      - name: Run six mechanism regressions
        run: python scripts/check_research_ideas_22_27.py
